# Vercel reads this file. The app itself runs from backend/ (see README); nothing is built or packaged from here.
[project]
name = "vettly"
version = "1.0.0"
# Keep in step with requirements.txt (Vercel may read either; backend/tests/test_pool.py checks they match)
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "groq>=0.9.0",
    "openai>=1.0.0",
    "PyPDF2>=3.0.0",
    "python-docx>=1.1.0",
    "httpx>=0.27.0",
    "aiofiles>=24.0.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "PyJWT[crypto]>=2.8.0",
    "psycopg[binary]>=3.2.0",
]

# The page's own files (web/: css, js, icons, fonts) go out from Vercel's CDN, next to the visitor, instead of through
# the Python function. Vercel switches this off by itself when an app has middleware (ours checks who is asking), so
# it is switched on by hand: every API route is declared before the static mount, so the API still reaches the function.
[tool.vercel.fastapi.static]
cdn = true
