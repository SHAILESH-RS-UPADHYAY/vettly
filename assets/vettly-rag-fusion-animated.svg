<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" width="100%" height="300">
  <defs>
    <pattern id="gridC" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    </pattern>
    <filter id="shC" x="-4%" y="-4%" width="110%" height="115%">
      <feDropShadow dx="2.5" dy="3.5" stdDeviation="0" flood-color="#0F172A" flood-opacity="0.9"/>
    </filter>
    <marker id="arB2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7"/>
    </marker>
    <marker id="arO3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
  </defs>

  <style>
    .hdr { font: 900 14px 'JetBrains Mono', monospace; fill: #0F172A; letter-spacing: 1px; }
    .card { fill: #FFFFFF; stroke: #0F172A; stroke-width: 2.2; rx: 12; }
    .title { font: 800 12px 'JetBrains Mono', monospace; fill: #0F172A; }
    .sub { font: 500 11px 'Segoe UI', sans-serif; fill: #475569; }
    .tag { font: 700 10px 'JetBrains Mono', monospace; fill: #0284C7; }
    .wire { fill: none; stroke-width: 2.4; stroke-dasharray: 7 5; animation: flowC 1s linear infinite; }
    @keyframes flowC { to { stroke-dashoffset: -24; } }
  </style>

  <rect width="1080" height="300" rx="16" fill="#FAF8F5"/>
  <rect width="1080" height="300" rx="16" fill="url(#gridC)"/>
  <rect x="3" y="3" width="1074" height="294" rx="14" fill="none" stroke="#0F172A" stroke-width="2.5"/>

  <text x="26" y="32" class="hdr">FIG 1.3 // 80K PRIORITY-WEIGHTED RAG FUSION &amp; SELF-LEARNING MEMORY (context_engine.py)</text>

  <!-- 4 Input Streams -->
  <g transform="translate(24, 54)" filter="url(#shC)">
    <rect width="235" height="46" rx="8" fill="#FFFFFF" stroke="#EA580C" stroke-width="2"/>
    <text x="12" y="20" class="title">🎯 1. Take-Home Assignment</text>
    <text x="12" y="36" class="sub">assignment_code.json (Priority #1)</text>
  </g>
  <g transform="translate(24, 108)" filter="url(#shC)">
    <rect width="235" height="46" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <text x="12" y="20" class="title">💼 2. Target Job Description</text>
    <text x="12" y="36" class="sub">Role + Stack Chips (Priority #2)</text>
  </g>
  <g transform="translate(24, 162)" filter="url(#shC)">
    <rect width="235" height="46" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
    <text x="12" y="20" class="title">📄 3. Resume + STAR Modules</text>
    <text x="12" y="36" class="sub">Projects, Experience, QA Bank</text>
  </g>
  <g transform="translate(24, 216)" filter="url(#shC)">
    <rect width="235" height="46" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="12" y="20" class="title">🐙 4. GitHub Codebase Trees</text>
    <text x="12" y="36" class="sub">Scraped READMEs &amp; File Trees</text>
  </g>

  <!-- Converging Animated Wires -->
  <path d="M 259 77 L 350 145" class="wire" stroke="#EA580C"/>
  <path d="M 259 131 L 350 155" class="wire" stroke="#0284C7"/>
  <path d="M 259 185 L 350 165" class="wire" stroke="#16A34A"/>
  <path d="M 259 239 L 350 175" class="wire" stroke="#7C3AED"/>
  <circle r="4.5" fill="#EA580C"><animateMotion dur="1.2s" repeatCount="indefinite" path="M 259 77 L 350 145"/></circle>
  <circle r="4.5" fill="#0284C7"><animateMotion dur="1.4s" repeatCount="indefinite" path="M 259 131 L 350 155"/></circle>
  <circle r="4.5" fill="#16A34A"><animateMotion dur="1.3s" repeatCount="indefinite" path="M 259 185 L 350 165"/></circle>
  <circle r="4.5" fill="#7C3AED"><animateMotion dur="1.5s" repeatCount="indefinite" path="M 259 239 L 350 175"/></circle>

  <!-- Context Fusion Core -->
  <g transform="translate(355, 58)" filter="url(#shC)">
    <rect width="345" height="205" class="card"/>
    <rect x="0" y="0" width="345" height="36" rx="10" fill="#F0F9FF" stroke="#0F172A" stroke-width="2"/>
    <text x="14" y="23" class="title">🧠 CONTEXT FUSION ENGINE (get_full_context)</text>

    <rect x="14" y="48" width="317" height="64" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
    <text x="24" y="68" class="title">Attention-Ordered 80,000-Char Window</text>
    <text x="24" y="86" class="sub">Places highest-signal specs (Assignment + JD) at</text>
    <text x="24" y="102" class="sub">top of LLM prompt to prevent lost-in-the-middle</text>

    <rect x="14" y="122" width="317" height="68" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
    <text x="24" y="142" class="title">💾 Self-Learning Chat Trigger Detector</text>
    <text x="24" y="160" class="sub">Detects "remember", "always", "shorter answers"</text>
    <text x="24" y="176" class="sub">➔ Auto-saves permanent CHAT_LEARNED_* rule</text>
  </g>

  <path d="M 700 160 L 755 160" class="wire" stroke="#0284C7" marker-end="url(#arB2)"/>
  <circle r="5" fill="#0284C7">
    <animateMotion dur="1.1s" repeatCount="indefinite" path="M 700 160 L 755 160"/>
  </circle>

  <!-- Persistent JSON Store -->
  <g transform="translate(762, 58)" filter="url(#shC)">
    <rect width="292" height="205" class="card"/>
    <rect x="0" y="0" width="292" height="36" rx="10" fill="#FFF7ED" stroke="#0F172A" stroke-width="2"/>
    <text x="14" y="23" class="title">🗄️ PERSISTENT CONTEXT STORE</text>
    <text x="14" y="58" class="tag">backend/context_store/*.json</text>
    <text x="14" y="80" class="sub">• context.json (Resume + GitHub + JD)</text>
    <text x="14" y="100" class="sub">• about_me.json (Identity Constraints)</text>
    <text x="14" y="120" class="sub">• assignment_code.json (Codebase Lines)</text>
    <text x="14" y="140" class="sub">• qa_cache.json (Synthesized Q&amp;A Bank)</text>
    <text x="14" y="160" class="sub">• chat_history.json (Active Copilot)</text>
    <text x="14" y="180" class="sub">• recycle_bin.json (Soft-Delete Vault)</text>
  </g>
</svg>
