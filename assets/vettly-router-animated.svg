<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 310" width="100%" height="310">
  <defs>
    <pattern id="gridR" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    </pattern>
    <filter id="shR" x="-4%" y="-4%" width="110%" height="115%">
      <feDropShadow dx="2.5" dy="3.5" stdDeviation="0" flood-color="#0F172A" flood-opacity="0.9"/>
    </filter>
    <marker id="arO" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arB" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
  </defs>

  <style>
    .hdr { font: 900 14px 'JetBrains Mono', monospace; fill: #0F172A; letter-spacing: 1px; }
    .card { fill: #FFFFFF; stroke: #0F172A; stroke-width: 2.2; rx: 12; }
    .title { font: 800 12.5px 'JetBrains Mono', monospace; fill: #0F172A; }
    .sub { font: 500 11px 'Segoe UI', sans-serif; fill: #475569; }
    .tag { font: 700 10px 'JetBrains Mono', monospace; fill: #EA580C; }
    .dash-line { fill: none; stroke-width: 2.5; stroke-dasharray: 7 5; animation: moveD 0.9s linear infinite; }
    @keyframes moveD { to { stroke-dashoffset: -24; } }
  </style>

  <rect width="1080" height="310" rx="16" fill="#FAF8F5"/>
  <rect width="1080" height="310" rx="16" fill="url(#gridR)"/>
  <rect x="3" y="3" width="1074" height="304" rx="14" fill="none" stroke="#0F172A" stroke-width="2.5"/>

  <text x="26" y="32" class="hdr">FIG 1.1 // MULTI-PROVIDER AUTO-FAILOVER &amp; RATE-LIMIT SHIELD (backend/ai/utils.py)</text>

  <!-- Input Request Node -->
  <g transform="translate(24, 65)" filter="url(#shR)">
    <rect width="175" height="195" class="card"/>
    <rect x="0" y="0" width="175" height="36" rx="10" fill="#FFF7ED" stroke="#0F172A" stroke-width="2"/>
    <text x="14" y="23" class="title">📥 INCOMING CALL</text>
    <text x="14" y="62" class="tag">80K Grounded Prompt</text>
    <text x="14" y="84" class="sub">• System Persona</text>
    <text x="14" y="104" class="sub">• Resume + GitHub</text>
    <text x="14" y="124" class="sub">• Target JD Spec</text>
    <text x="14" y="144" class="sub">• Last 10 Turns</text>
    <text x="14" y="170" class="tag">json_mode: True/False</text>
  </g>

  <path d="M 199 162 L 245 162" class="dash-line" stroke="#EA580C" marker-end="url(#arO)"/>
  <circle r="5" fill="#EA580C">
    <animateMotion dur="1.1s" repeatCount="indefinite" path="M 199 162 L 245 162"/>
  </circle>

  <!-- Priority Chain -->
  <g transform="translate(252, 52)" filter="url(#shR)">
    <rect width="545" height="225" class="card"/>
    <rect x="0" y="0" width="545" height="36" rx="10" fill="#F0F9FF" stroke="#0F172A" stroke-width="2"/>
    <text x="16" y="23" class="title">🔀 PRIORITY FAILOVER CASCADE + 429 EXPONENTIAL BACKOFF</text>

    <!-- Tier 1 -->
    <g transform="translate(14, 50)">
      <rect width="120" height="155" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
      <text x="10" y="24" class="title">1. CLAUDE</text>
      <text x="10" y="44" class="sub">Sonnet 3.5</text>
      <text x="10" y="66" class="sub">200K Window</text>
      <text x="10" y="92" class="tag">If 429/529:</text>
      <text x="10" y="110" class="sub">Retry 2s➔4s➔8s</text>
      <text x="10" y="138" class="tag">Else Failover ➔</text>
    </g>

    <!-- Tier 2 -->
    <g transform="translate(146, 50)">
      <rect width="120" height="155" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="2"/>
      <text x="10" y="24" class="title">2. GEMINI</text>
      <text x="10" y="44" class="sub">2.5 Flash</text>
      <text x="10" y="66" class="sub">1M Context</text>
      <text x="10" y="92" class="tag">Native JSON:</text>
      <text x="10" y="110" class="sub">application/json</text>
      <text x="10" y="138" class="tag">Else Failover ➔</text>
    </g>

    <!-- Tier 3 -->
    <g transform="translate(278, 50)">
      <rect width="120" height="155" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
      <text x="10" y="24" class="title">3. OPENAI</text>
      <text x="10" y="44" class="sub">GPT-4o-mini</text>
      <text x="10" y="66" class="sub">128K Window</text>
      <text x="10" y="92" class="tag">Backoff Loop:</text>
      <text x="10" y="110" class="sub">7 Max Retries</text>
      <text x="10" y="138" class="tag">Else Failover ➔</text>
    </g>

    <!-- Tier 4 -->
    <g transform="translate(410, 50)">
      <rect width="120" height="155" rx="8" fill="#FAF5FF" stroke="#7C3AED" stroke-width="2"/>
      <text x="10" y="24" class="title">4. GROQ LPU</text>
      <text x="10" y="44" class="sub">Llama 3.3 70B</text>
      <text x="10" y="66" class="sub">Ultra-Fast LPU</text>
      <text x="10" y="92" class="tag">Auto-Guard:</text>
      <text x="10" y="110" class="sub">Slices to 14K</text>
      <text x="10" y="138" class="tag">Zero 413 Error</text>
    </g>
  </g>

  <path d="M 797 162 L 845 162" class="dash-line" stroke="#16A34A" marker-end="url(#arG)"/>
  <circle r="5" fill="#16A34A">
    <animateMotion dur="1.1s" repeatCount="indefinite" path="M 797 162 L 845 162"/>
  </circle>

  <!-- Output Guaranteed Node -->
  <g transform="translate(852, 65)" filter="url(#shR)">
    <rect width="204" height="195" class="card"/>
    <rect x="0" y="0" width="204" height="36" rx="10" fill="#F0FDF4" stroke="#0F172A" stroke-width="2"/>
    <text x="14" y="23" class="title">✅ GUARANTEED OUTPUT</text>
    <text x="14" y="64" class="sub">• Zero Single-Point Failure</text>
    <text x="14" y="88" class="sub">• Clean JSON Unwrapping</text>
    <text x="14" y="112" class="sub">• Asterisk Sanitization</text>
    <text x="14" y="136" class="sub">• Ready for RL Validator</text>
    <rect x="14" y="152" width="176" height="26" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
    <text x="26" y="169" class="title" fill="#15803D">99.9% STUDIO UPTIME</text>
  </g>
</svg>
