<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 295" width="100%" height="295">
  <defs>
    <pattern id="gridH" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    </pattern>
    <filter id="shH" x="-4%" y="-4%" width="110%" height="115%">
      <feDropShadow dx="2.5" dy="3.5" stdDeviation="0" flood-color="#0F172A" flood-opacity="0.9"/>
    </filter>
    <marker id="arG2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arO2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
  </defs>

  <style>
    .hdr { font: 900 14px 'JetBrains Mono', monospace; fill: #0F172A; letter-spacing: 1px; }
    .card { fill: #FFFFFF; stroke: #0F172A; stroke-width: 2.2; rx: 12; }
    .title { font: 800 12.5px 'JetBrains Mono', monospace; fill: #0F172A; }
    .sub { font: 500 11px 'Segoe UI', sans-serif; fill: #475569; }
    .tag { font: 700 10.5px 'JetBrains Mono', monospace; fill: #16A34A; }
    .wire { fill: none; stroke-width: 2.5; stroke-dasharray: 7 5; animation: flowH 0.9s linear infinite; }
    .bar-fill { animation: barGrow 2.8s ease-in-out infinite alternate; }
    @keyframes flowH { to { stroke-dashoffset: -24; } }
    @keyframes barGrow { 0% { width: 120px; } 100% { width: 168px; } }
  </style>

  <rect width="1080" height="295" rx="16" fill="#FFFFFF"/>
  <rect width="1080" height="295" rx="16" fill="url(#gridH)"/>
  <rect x="3" y="3" width="1074" height="289" rx="14" fill="none" stroke="#0F172A" stroke-width="2.5"/>

  <text x="26" y="32" class="hdr">FIG 1.2 // DE-ROBOTIZER &amp; 7-DIMENSION RL VALIDATION LOOP (answer_validator.py + humanizer.py)</text>

  <!-- Box 1: Raw LLM Draft -->
  <g transform="translate(24, 58)" filter="url(#shH)">
    <rect width="225" height="205" class="card"/>
    <rect x="0" y="0" width="225" height="36" rx="10" fill="#FFF7ED" stroke="#0F172A" stroke-width="2"/>
    <text x="14" y="23" class="title">1. RAW LLM DRAFT</text>
    <text x="14" y="60" class="sub">• First-person ("I", "my")</text>
    <text x="14" y="82" class="sub">• Grounded in Resume/GitHub</text>
    <text x="14" y="104" class="sub">• Real metrics (p95, Redis)</text>
    <text x="14" y="126" class="sub">• EN or Hinglish mode</text>
    <rect x="14" y="146" width="197" height="42" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <text x="22" y="164" class="sub" fill="#991B1B">May contain AI meta-openers</text>
    <text x="22" y="180" class="sub" fill="#991B1B">or markdown asterisks (**)</text>
  </g>

  <path d="M 249 160 L 295 160" class="wire" stroke="#EA580C" marker-end="url(#arO2)"/>
  <circle r="5" fill="#EA580C">
    <animateMotion dur="1.1s" repeatCount="indefinite" path="M 249 160 L 295 160"/>
  </circle>

  <!-- Box 2: Humanizer Filter -->
  <g transform="translate(302, 58)" filter="url(#shH)">
    <rect width="240" height="205" class="card"/>
    <rect x="0" y="0" width="240" height="36" rx="10" fill="#F0F9FF" stroke="#0F172A" stroke-width="2"/>
    <text x="14" y="23" class="title">2. HUMANIZER FILTER</text>
    <text x="14" y="60" class="sub">Strips Meta-Phrases:</text>
    <text x="14" y="80" class="sub">❌ "To expand on that..."</text>
    <text x="14" y="98" class="sub">❌ "As mentioned earlier..."</text>
    <text x="14" y="116" class="sub">❌ "Certainly! Here is..."</text>
    <text x="14" y="140" class="sub">Enforces Spoken Cadence:</text>
    <text x="14" y="160" class="tag">✔ Starts with Core Mechanism</text>
    <text x="14" y="180" class="tag">✔ Zero Raw Asterisks (*)</text>
  </g>

  <path d="M 542 160 L 588 160" class="wire" stroke="#16A34A" marker-end="url(#arG2)"/>
  <circle r="5" fill="#16A34A">
    <animateMotion dur="1.1s" repeatCount="indefinite" path="M 542 160 L 588 160"/>
  </circle>

  <!-- Box 3: 7-Dimension Scorer -->
  <g transform="translate(595, 58)" filter="url(#shH)">
    <rect width="245" height="205" class="card"/>
    <rect x="0" y="0" width="245" height="36" rx="10" fill="#F0FDF4" stroke="#0F172A" stroke-width="2"/>
    <text x="14" y="23" class="title">3. 7-DIM RL SCORER</text>

    <text x="14" y="58" class="sub">1. Naturalness (9.2/10)</text>
    <rect x="14" y="64" width="180" height="7" rx="3.5" fill="#E2E8F0"/>
    <rect x="14" y="64" width="165" height="7" rx="3.5" fill="#16A34A" class="bar-fill"/>

    <text x="14" y="90" class="sub">2. Metric Specificity (9.0/10)</text>
    <rect x="14" y="96" width="180" height="7" rx="3.5" fill="#E2E8F0"/>
    <rect x="14" y="96" width="160" height="7" rx="3.5" fill="#0284C7" class="bar-fill"/>

    <text x="14" y="122" class="sub">3. Zero AI Tells (9.5/10)</text>
    <rect x="14" y="128" width="180" height="7" rx="3.5" fill="#E2E8F0"/>
    <rect x="14" y="128" width="170" height="7" rx="3.5" fill="#EA580C" class="bar-fill"/>

    <text x="14" y="156" class="sub">If Score &lt; 8.0 ➔ Auto-Rewriter</text>
    <text x="14" y="178" class="tag">If Score ≥ 8.0 ➔ PASS &amp; CACHE</text>
  </g>

  <path d="M 840 160 L 882 160" class="wire" stroke="#16A34A" marker-end="url(#arG2)"/>
  <circle r="5" fill="#16A34A">
    <animateMotion dur="1.1s" repeatCount="indefinite" path="M 840 160 L 882 160"/>
  </circle>

  <!-- Box 4: Studio HUD & RL Refine -->
  <g transform="translate(888, 58)" filter="url(#shH)">
    <rect width="168" height="205" class="card"/>
    <rect x="0" y="0" width="168" height="36" rx="10" fill="#FAF5FF" stroke="#0F172A" stroke-width="2"/>
    <text x="12" y="23" class="title">4. STUDIO HUD</text>
    <text x="12" y="60" class="sub">• Top Sort (Q# ↓)</text>
    <text x="12" y="84" class="sub">• 👍/👎 RL Rating</text>
    <text x="12" y="108" class="sub">• ✏️ Custom Refine</text>
    <text x="12" y="132" class="sub">• Auto-Syncs to</text>
    <text x="12" y="150" class="sub">  Permanent QA Bank</text>
    <rect x="12" y="164" width="144" height="26" rx="6" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="20" y="181" class="title" fill="#6D28D9">READY TO SPEAK</text>
  </g>
</svg>
