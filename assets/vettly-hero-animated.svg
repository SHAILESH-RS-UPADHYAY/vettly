<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 290" width="100%" height="290">
  <defs>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F3EFEA"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <pattern id="bpGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="28" cy="28" r="1" fill="#CBD5E1"/>
    </pattern>
    <filter id="cardShadow" x="-5%" y="-5%" width="112%" height="118%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#0F172A" flood-opacity="0.9"/>
    </filter>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="2.5" stdDeviation="0" flood-color="#0F172A" flood-opacity="0.85"/>
    </filter>
  </defs>

  <style>
    .hero-title { font: 900 54px 'Segoe UI', 'Outfit', system-ui, sans-serif; fill: #0F172A; letter-spacing: 1.5px; }
    .hero-accent { fill: #EA580C; }
    .hero-sub { font: 600 16px 'JetBrains Mono', 'Consolas', monospace; fill: #334155; letter-spacing: 0.5px; }
    .stamp-box { fill: #FFF7ED; stroke: #0F172A; stroke-width: 2; rx: 8; }
    .pill-card { fill: #FFFFFF; stroke: #0F172A; stroke-width: 2; rx: 8; }
    .pill-text { font: 800 11.5px 'JetBrains Mono', 'Consolas', monospace; fill: #0F172A; letter-spacing: 0.8px; }
    .grid-flow { stroke-dasharray: 8 6; animation: dashMove 12s linear infinite; }
    .pulse-led { animation: ledBlink 1.8s ease-in-out infinite; }
    .scanner { animation: scanBar 3.6s ease-in-out infinite alternate; }
    .float-node { animation: floatY 3s ease-in-out infinite alternate; }
    @keyframes dashMove { to { stroke-dashoffset: -280; } }
    @keyframes ledBlink { 0%, 100% { opacity: 0.35; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.15); } }
    @keyframes scanBar { 0% { transform: translateX(-190px); } 100% { transform: translateX(190px); } }
    @keyframes floatY { 0% { transform: translateY(-3px); } 100% { transform: translateY(3px); } }
  </style>

  <!-- White Parchment Blueprint Background -->
  <rect width="1080" height="290" rx="18" fill="url(#paperGrad)"/>
  <rect width="1080" height="290" rx="18" fill="url(#bpGrid)"/>
  <rect x="3" y="3" width="1074" height="284" rx="16" fill="none" stroke="#0F172A" stroke-width="3"/>
  <rect x="9" y="9" width="1062" height="272" rx="12" fill="none" stroke="#EA580C" stroke-width="1.2" stroke-dasharray="6 4"/>

  <!-- Animated Circuit Lines in Background -->
  <path id="heroTrackL" d="M 35 75 L 220 75 L 260 115 L 340 115" fill="none" stroke="#CBD5E1" stroke-width="2" class="grid-flow"/>
  <path id="heroTrackR" d="M 1045 75 L 860 75 L 820 115 L 740 115" fill="none" stroke="#CBD5E1" stroke-width="2" class="grid-flow"/>
  <circle r="4.5" fill="#EA580C">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M 35 75 L 220 75 L 260 115 L 340 115"/>
  </circle>
  <circle r="4.5" fill="#0284C7">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M 1045 75 L 860 75 L 820 115 L 740 115"/>
  </circle>

  <!-- Top Blueprint Architect Badge -->
  <g transform="translate(385, 26)" filter="url(#softShadow)">
    <rect width="310" height="32" class="stamp-box"/>
    <circle cx="20" cy="16" r="5.5" fill="#16A34A" class="pulse-led"/>
    <text x="36" y="20" class="pill-text">VETTLY ARCHITECT BLUEPRINT // v1.0</text>
  </g>

  <!-- Main Title -->
  <text x="540" y="126" text-anchor="middle" class="hero-title">
    ❖ VETTLY <tspan class="hero-accent">STUDIO</tspan>
  </text>

  <!-- Animated Scanner Bar -->
  <rect x="330" y="140" width="420" height="6" rx="3" fill="#E2E8F0"/>
  <g class="scanner">
    <rect x="460" y="140" width="160" height="6" rx="3" fill="url(#accentGrad)"/>
  </g>

  <!-- Subtitle -->
  <text x="540" y="176" text-anchor="middle" class="hero-sub">
    AI Career Readiness Architect • 80K RAG Context Toolbelt • Multi-Model Prep Studio
  </text>

  <!-- 4 Tactile Blueprint Feature Pills -->
  <g transform="translate(68, 210)" filter="url(#cardShadow)" class="float-node">
    <rect width="218" height="42" class="pill-card"/>
    <rect x="0" y="0" width="8" height="42" rx="4" fill="#EA580C"/>
    <circle cx="24" cy="21" r="5" fill="#EA580C" class="pulse-led"/>
    <text x="38" y="25" class="pill-text">1. 80K RAG TOOLBELT</text>
  </g>

  <g transform="translate(306, 210)" filter="url(#cardShadow)" class="float-node">
    <rect width="232" height="42" class="pill-card"/>
    <rect x="0" y="0" width="8" height="42" rx="4" fill="#0284C7"/>
    <circle cx="24" cy="21" r="5" fill="#0284C7" class="pulse-led"/>
    <text x="38" y="25" class="pill-text">2. CLAUDE • GEMINI • GROQ</text>
  </g>

  <g transform="translate(558, 210)" filter="url(#cardShadow)" class="float-node">
    <rect width="215" height="42" class="pill-card"/>
    <rect x="0" y="0" width="8" height="42" rx="4" fill="#16A34A"/>
    <circle cx="24" cy="21" r="5" fill="#16A34A" class="pulse-led"/>
    <text x="38" y="25" class="pill-text">3. 9-MODE PREP HUD</text>
  </g>

  <g transform="translate(793, 210)" filter="url(#cardShadow)" class="float-node">
    <rect width="218" height="42" class="pill-card"/>
    <rect x="0" y="0" width="8" height="42" rx="4" fill="#7C3AED"/>
    <circle cx="24" cy="21" r="5" fill="#7C3AED" class="pulse-led"/>
    <text x="38" y="25" class="pill-text">4. RL HUMANIZER LOOP</text>
  </g>
</svg>
